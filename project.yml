name: Nexo
options:
  bundleIdPrefix: com.luckylopolis
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Nexo Local Signing"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    DEAD_CODE_STRIPPING: YES
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      OTHER_CODE_SIGN_FLAGS: "--timestamp=none"

packages:
  ShortcutRecorder:
    path: Vendor/ShortcutRecorder

targets:
  Nexo:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: Core
      - path: Resources
        optional: true
      - path: Modules
        excludes:
          - "**/*.md"
          - "**/*.h"
    dependencies:
      - package: ShortcutRecorder
    info:
      path: App/Info.plist
      properties:
        CFBundleName: Nexo
        CFBundleDisplayName: Nexo
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSUIElement: true
        NSPrincipalClass: "$(PRODUCT_MODULE_NAME).App"
        CFBundleIconFile: app.png
        ATSApplicationFontsPath: ""
        NSSupportsAutomaticTermination: false
        NSSupportsSuddenTermination: false
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: "GPL-3.0 — includes code from AltTab (lwouis) and others, see NOTICE.md"
        NSAppleEventsUsageDescription: "Nexo uses Automation to read context from other apps."
        NSAudioCaptureUsageDescription: "Nexo needs audio capture to control per-app volume."
    entitlements:
      path: App/Nexo.entitlements
      properties:
        com.apple.security.app-sandbox: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.luckylopolis.nexo
        PRODUCT_NAME: Nexo
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Nexo.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: Modules/Switcher/Switcher-Bridging-Header.h
        # SkyLight (private) backs the switcher's CGS/SLS calls.
        FRAMEWORK_SEARCH_PATHS: "$(inherited) /System/Library/PrivateFrameworks"
        OTHER_LDFLAGS: "$(inherited) -framework SkyLight"
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
        INFOPLIST_OUTPUT_FORMAT: binary
        STRINGS_FILE_OUTPUT_ENCODING: UTF-8
        HEADER_SEARCH_PATHS: "$(SRCROOT)/Modules/Switcher/vendors"

  NexoTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: Nexo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.luckylopolis.nexo.tests
        # @testable import Nexo re-reads the app's bridging header.
        HEADER_SEARCH_PATHS: "$(SRCROOT)/Modules/Switcher/vendors"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Nexo.app/Contents/MacOS/Nexo"
        BUNDLE_LOADER: "$(TEST_HOST)"
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Nexo:
    build:
      targets:
        Nexo: all
        NexoTests: [test]
    test:
      targets:
        - NexoTests
