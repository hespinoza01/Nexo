name: Nexo
options:
  bundleIdPrefix: com.luckylopolis
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Nexo Local Signing"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    DEAD_CODE_STRIPPING: YES
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      OTHER_CODE_SIGN_FLAGS: "--timestamp=none"

packages:
  ShortcutRecorder:
    path: Vendor/ShortcutRecorder

targets:
  Nexo:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: Core
      - path: Resources
        optional: true
    dependencies:
      - package: ShortcutRecorder
    info:
      path: App/Info.plist
      properties:
        CFBundleName: Nexo
        CFBundleDisplayName: Nexo
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.utilities
        NSHumanReadableCopyright: "GPL-3.0 — includes code from AltTab (lwouis) and others, see NOTICE.md"
        NSAppleEventsUsageDescription: "Nexo uses Automation to read context from other apps."
        NSAudioCaptureUsageDescription: "Nexo needs audio capture to control per-app volume."
    entitlements:
      path: App/Nexo.entitlements
      properties:
        com.apple.security.app-sandbox: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.luckylopolis.nexo
        PRODUCT_NAME: Nexo
        INFOPLIST_FILE: App/Info.plist
        CODE_SIGN_ENTITLEMENTS: App/Nexo.entitlements

  # NexoTests target is added in sub-plan 10/14 (unit tests).

schemes:
  Nexo:
    build:
      targets:
        Nexo: all
